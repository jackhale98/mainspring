name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Format, typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:unit
      # Production dependencies that can reach the built site must be GPL-2.0 compatible (ADR-0001).
      - run: node scripts/ci/licenses.mjs

  engine:
    name: Engine build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:engine
      - run: npm run build:engine -- --check
      - name: Check engine/tj matches tj.pin.json
        run: |
          pinned="$(node -p "require('./engine/tj.pin.json').tree")"
          actual="$(git rev-parse HEAD:engine/tj)"
          test "$pinned" = "$actual"
      - uses: actions/upload-artifact@v4
        with:
          name: engine
          path: public/engine/
          retention-days: 7

  e2e:
    name: End-to-end and accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browsers and system dependencies
        # The runner's apt index can be stale, and mirrors occasionally fail, so refresh it
        # first and retry the whole install a few times.
        run: |
          for attempt in 1 2 3; do
            sudo apt-get update -q && npx playwright install --with-deps chromium webkit && exit 0
            echo "install attempt $attempt failed; retrying in 20s"
            sleep 20
          done
          exit 1
      - run: npm run build
        env:
          MAINSPRING_DEV_PAGES: '1'
      - run: npm run test:e2e
      # Gate criterion 2 (UI thread stays responsive while a 1,000-task plan schedules). Reuses the
      # dev-pages build above; one worker, no retries (playwright.responsiveness.config.ts).
      - name: Responsiveness gate
        run: npm run test:responsiveness
        env:
          RESPONSIVENESS_SKIP_BUILD: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: responsiveness-report
          path: test-results/responsiveness-*
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  golden:
    name: Golden plans (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium and system dependencies
        # Same retrying install as the e2e job.
        run: |
          for attempt in 1 2 3; do
            sudo apt-get update -q && npx playwright install --with-deps chromium && exit 0
            echo "install attempt $attempt failed; retrying in 20s"
            sleep 20
          done
          exit 1
      # Builds the engine and the site with MAINSPRING_DEV_PAGES=1, then runs tests/golden/parity.spec.ts.
      - run: npm run test:golden
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-report
          path: |
            test-results/golden-report.md
            test-results/golden-report.json
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: golden-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  no-ruby:
    name: No Ruby invoked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - run: node scripts/ci/no-ruby.mjs
