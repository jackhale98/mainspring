name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Format, typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:unit

  # enabled when T5/T11 land (build:engine currently exits 1 by design)
  engine:
    name: Engine build
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:engine
      - run: npm run build:engine -- --check
      - name: Check engine/tj matches tj.pin.json
        run: |
          pinned="$(node -p "require('./engine/tj.pin.json').tree")"
          actual="$(git rev-parse HEAD:engine/tj)"
          test "$pinned" = "$actual"
      - uses: actions/upload-artifact@v4
        with:
          name: engine
          path: public/engine/
          retention-days: 7

  e2e:
    name: End-to-end and accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  # enabled when T5/T11 land (test:golden currently exits 1 by design)
  golden:
    name: Golden plans (Chromium)
    if: false
    needs: engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: engine
          path: public/engine/
      - run: npx playwright install --with-deps chromium
      - run: npm run test:golden
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: golden-diff-report
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  no-ruby:
    name: No Ruby invoked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - run: node scripts/ci/no-ruby.mjs
