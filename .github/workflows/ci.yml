name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Format, typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      # The committed TJP parser must match src/lib/tjp/grammar/tjp.grammar.
      - run: npm run build:grammar -- --check
      - run: npm run typecheck
      - run: npm run test:unit
      # Gate criterion 1 (phase-1.md 9.1, 9.2): parse then print every golden file byte for byte,
      # and the index against the goldens. Needs no engine build.
      - run: npm run test:roundtrip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roundtrip-report
          path: |
            test-results/roundtrip-report.*
            test-results/index-crosscheck.json
          if-no-files-found: ignore
          retention-days: 14
      # Production dependencies that can reach the built site must be GPL-2.0 compatible (ADR-0001).
      - run: node scripts/ci/licenses.mjs

  engine:
    name: Engine build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:engine
      - run: npm run build:engine -- --check
      # Formatted golden plans must still match their goldens on this engine (phase-1 spec 7.3).
      # FORMAT_SCHEDULE=1 makes the test fail, not skip, if public/engine is missing.
      - run: npx vitest run src/lib/tjp/format.schedule.test.ts
        env:
          FORMAT_SCHEDULE: '1'
      # The schedule runner against this engine: edit, schedule, diagnostics and finish date
      # (phase-1 spec 6.8). SCHEDULE_RUNNER_ENGINE=1 makes it fail, not skip, without the engine.
      - run: npx vitest run src/lib/workspace/schedule-runner.engine.test.ts
        env:
          SCHEDULE_RUNNER_ENGINE: '1'
      # Task attribute edits must still schedule on this engine (phase-1 spec 9.3 P4).
      # TJP_EDIT_ENGINE=1 makes the test fail, not skip, if public/engine is missing; FC_SEED fixes
      # the fast-check seed so a failure replays.
      - run: npx vitest run src/lib/tjp/edit/task-attrs.engine.test.ts
        env:
          TJP_EDIT_ENGINE: '1'
          FC_SEED: '20261112'
      # Task tree edits (add, delete, move) on golden and generated plans must still schedule on this
      # engine (phase-1 spec 9.3 P4); same flags as above.
      - run: npx vitest run src/lib/tjp/edit/task-tree.engine.test.ts
        env:
          TJP_EDIT_ENGINE: '1'
          FC_SEED: '20261112'
      # The committed keyword table (src/lib/tjp/syntax/keywords.generated.ts) must match this
      # engine's syntax() and pinned TaskJuggler commit (phase-1 spec 6.3, 14.12). A different
      # engine build hash alone (bridge-only changes) prints a note and passes.
      - run: npm run gen:keywords -- --check
      - name: Check engine/tj matches tj.pin.json
        run: |
          pinned="$(node -p "require('./engine/tj.pin.json').tree")"
          actual="$(git rev-parse HEAD:engine/tj)"
          test "$pinned" = "$actual"
      - uses: actions/upload-artifact@v4
        with:
          name: engine
          path: public/engine/
          retention-days: 7

  e2e:
    name: End-to-end and accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browsers and system dependencies
        # The runner's apt index can be stale, and mirrors occasionally fail, so refresh it
        # first and retry the whole install a few times.
        run: |
          for attempt in 1 2 3; do
            sudo apt-get update -q && npx playwright install --with-deps chromium webkit && exit 0
            echo "install attempt $attempt failed; retrying in 20s"
            sleep 20
          done
          exit 1
      - run: npm run build
        env:
          MAINSPRING_DEV_PAGES: '1'
      - run: npm run test:e2e
      # Gate criterion 2 (UI thread stays responsive while a 1,000-task plan schedules). Reuses the
      # dev-pages build above; one worker, no retries (playwright.responsiveness.config.ts).
      - name: Responsiveness gate
        run: npm run test:responsiveness
        env:
          RESPONSIVENESS_SKIP_BUILD: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: responsiveness-report
          path: test-results/responsiveness-*
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  golden:
    name: Golden plans (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium and system dependencies
        # Same retrying install as the e2e job.
        run: |
          for attempt in 1 2 3; do
            sudo apt-get update -q && npx playwright install --with-deps chromium && exit 0
            echo "install attempt $attempt failed; retrying in 20s"
            sleep 20
          done
          exit 1
      # Builds the engine and the site with MAINSPRING_DEV_PAGES=1, then runs tests/golden/parity.spec.ts.
      - run: npm run test:golden
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-report
          path: |
            test-results/golden-report.md
            test-results/golden-report.json
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: golden-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  no-ruby:
    name: No Ruby invoked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - run: node scripts/ci/no-ruby.mjs
