name: Nightly

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Results are recorded, not blocking: every job is continue-on-error and none is a required check.
jobs:
  timings:
    name: Engine timings per golden plan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:engine
      # Boots the built wasm engine in Node (no browser). Best of 3 runs per plan.
      - name: Time the wasm engine per plan
        run: |
          mkdir -p test-results
          node engine/golden/run-wasm.mjs --repeat 3 --json test-results/engine-timings.json
      # Ratio of wasm to native per plan. Reporting only, never compared against a limit.
      - name: Summarise against native timings
        if: always()
        run: |
          if [ -f test-results/engine-timings.json ]; then
            {
              echo '## Engine timings: wasm vs native'
              echo
              node scripts/ci/timings-summary.mjs test-results/engine-timings.json
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No timings were produced.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-timings
          path: test-results/engine-timings.json
          if-no-files-found: warn
          retention-days: 30

  fidelity-nightly:
    name: Patch fidelity (shard ${{ matrix.shard }} of 4)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      # 5,000 generated and 500 corpus cases in all, split over four shards of the same sequence
      # (phase-1.md 9.3). The seed changes every night, so the run explores new plans; every shard
      # uses the same one. FIDELITY_CORPUS=nightly adds Tutorial and Fedora with 20 cases each (tests/fidelity/corpus.json).
      FIDELITY_RUNS: '5000'
      FIDELITY_CORPUS_RUNS: '500'
      FIDELITY_CORPUS: nightly
      FIDELITY_SEED: ${{ github.run_number }}
      FIDELITY_SHARD: ${{ matrix.shard }}/4
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:engine
      - run: npm run gen:keywords -- --check
      - run: npm run test:fidelity
      - name: Add the report to the step summary
        if: always()
        run: |
          if [ -f test-results/fidelity-report.md ]; then
            cat test-results/fidelity-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fidelity-report-shard-${{ matrix.shard }}
          path: |
            test-results/fidelity-report.md
            test-results/fidelity-report.json
          if-no-files-found: warn
          retention-days: 30

  fidelity-merge:
    name: Patch fidelity (all shards)
    needs: fidelity-nightly
    if: always()
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v4
        with:
          pattern: fidelity-report-shard-*
          path: shard-reports
      # One per-intent table over the shards (gate evidence); fails when an intent type has fewer than
      # 5 edits in all, P4 ran on no case, or a shard reported a failure.
      - run: node scripts/ci/fidelity-merge.mjs shard-reports --out test-results
      - name: Add the merged report to the step summary
        if: always()
        run: |
          if [ -f test-results/fidelity-report-merged.md ]; then
            cat test-results/fidelity-report-merged.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fidelity-report-merged
          path: |
            test-results/fidelity-report-merged.md
            test-results/fidelity-report-merged.json
          if-no-files-found: warn
          retention-days: 30

  golden-cross-browser:
    name: Golden plans (${{ matrix.browser }})
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ matrix.browser }}-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install ${{ matrix.browser }} and system dependencies
        # Same retrying install as the e2e and golden jobs in ci.yml.
        run: |
          for attempt in 1 2 3; do
            sudo apt-get update -q && npx playwright install --with-deps ${{ matrix.browser }} && exit 0
            echo "install attempt $attempt failed; retrying in 20s"
            sleep 20
          done
          exit 1
      # Builds the engine and the site with MAINSPRING_DEV_PAGES=1, then runs tests/golden/parity.spec.ts.
      - run: npm run test:golden -- --browser=${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-report-${{ matrix.browser }}
          path: |
            test-results/golden-report.md
            test-results/golden-report.json
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: golden-test-results-${{ matrix.browser }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  responsiveness:
    name: Engine responsiveness (reporting only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium and system dependencies
        run: |
          for attempt in 1 2 3; do
            sudo apt-get update -q && npx playwright install --with-deps chromium && exit 0
            echo "install attempt $attempt failed; retrying in 20s"
            sleep 20
          done
          exit 1
      - run: npm run test:responsiveness
      - name: Add the report to the step summary
        if: always()
        run: |
          if [ -f test-results/responsiveness-report.md ]; then
            cat test-results/responsiveness-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: responsiveness-report
          path: |
            test-results/responsiveness-report.md
            test-results/responsiveness-report.json
          if-no-files-found: warn
          retention-days: 30
