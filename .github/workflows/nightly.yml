name: Nightly

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Results are recorded, not blocking: every job is continue-on-error and none is a required check.
jobs:
  timings:
    name: Engine timings per golden plan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:engine
      # Boots the built wasm engine in Node (no browser). Best of 3 runs per plan.
      - name: Time the wasm engine per plan
        run: |
          mkdir -p test-results
          node engine/golden/run-wasm.mjs --repeat 3 --json test-results/engine-timings.json
      # Ratio of wasm to native per plan. Reporting only, never compared against a limit.
      - name: Summarise against native timings
        if: always()
        run: |
          if [ -f test-results/engine-timings.json ]; then
            {
              echo '## Engine timings: wasm vs native'
              echo
              node scripts/ci/timings-summary.mjs test-results/engine-timings.json
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No timings were produced.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-timings
          path: test-results/engine-timings.json
          if-no-files-found: warn
          retention-days: 30

  fidelity-nightly:
    name: Patch fidelity (shard ${{ matrix.shard }} of 4)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      # 5,000 generated and 500 corpus cases in all, split over four shards of the same sequence
      # (phase-1.md 9.3). The seed changes every night, so the run explores new plans; every shard
      # uses the same one. FIDELITY_CORPUS=nightly adds Tutorial and Fedora with 20 cases each (tests/fidelity/corpus.json).
      FIDELITY_RUNS: '5000'
      FIDELITY_CORPUS_RUNS: '500'
      FIDELITY_CORPUS: nightly
      FIDELITY_SEED: ${{ github.run_number }}
      FIDELITY_SHARD: ${{ matrix.shard }}/4
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:engine
      - run: npm run gen:keywords -- --check
      - run: npm run test:fidelity
      - name: Add the report to the step summary
        if: always()
        run: |
          if [ -f test-results/fidelity-report.md ]; then
            cat test-results/fidelity-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fidelity-report-shard-${{ matrix.shard }}
          path: |
            test-results/fidelity-report.md
            test-results/fidelity-report.json
          if-no-files-found: warn
          retention-days: 30

  fidelity-merge:
    name: Patch fidelity (all shards)
    needs: fidelity-nightly
    if: always()
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v4
        with:
          pattern: fidelity-report-shard-*
          path: shard-reports
      # One per-intent table over the shards (gate evidence); fails when an intent type has fewer than
      # 5 edits in all, P4 ran on no case, or a shard reported a failure.
      - run: node scripts/ci/fidelity-merge.mjs shard-reports --shards 4 --out test-results
      - name: Add the merged report to the step summary
        if: always()
        run: |
          if [ -f test-results/fidelity-report-merged.md ]; then
            cat test-results/fidelity-report-merged.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fidelity-report-merged
          path: |
            test-results/fidelity-report-merged.md
            test-results/fidelity-report-merged.json
          if-no-files-found: warn
          retention-days: 30

  fast-path-nightly:
    name: Fast path equivalence (500 generated plans)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 90
    env:
      # ADR-0010, section CI: the per-push run's suites at nightly size. The seed changes every
      # night, so the run explores new plans; FAST_PATH_SEED=<run number> replays one.
      FAST_PATH: '1'
      FAST_PATH_RUNS: '500'
      FAST_PATH_DIRECTION_RUNS: '200'
      FAST_PATH_PURGE_RUNS: '200'
      FAST_PATH_CORPUS_EDITS: '6'
      FAST_PATH_SEED: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:engine
      - run: npm run test:fast-path
      - name: Add the report to the step summary
        if: always()
        run: |
          if [ -f test-results/fast-path-equivalence.json ]; then
            {
              echo "## Fast path equivalence (seed $FAST_PATH_SEED)"
              echo
              echo '```json'
              cat test-results/fast-path-equivalence.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fast-path-equivalence
          path: test-results/fast-path-equivalence.json
          if-no-files-found: warn
          retention-days: 30

  golden-cross-browser:
    name: Golden plans (${{ matrix.browser }})
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ matrix.browser }}-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install ${{ matrix.browser }} and system dependencies
        # Same retrying install as the e2e and golden jobs in ci.yml.
        run: |
          for attempt in 1 2 3; do
            sudo apt-get update -q && npx playwright install --with-deps ${{ matrix.browser }} && exit 0
            echo "install attempt $attempt failed; retrying in 20s"
            sleep 20
          done
          exit 1
      # Builds the engine and the site with MAINSPRING_DEV_PAGES=1, then runs tests/golden/parity.spec.ts.
      - run: npm run test:golden -- --browser=${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-report-${{ matrix.browser }}
          path: |
            test-results/golden-report.md
            test-results/golden-report.json
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: golden-test-results-${{ matrix.browser }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  responsiveness:
    name: Engine responsiveness (reporting only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium and system dependencies
        run: |
          for attempt in 1 2 3; do
            sudo apt-get update -q && npx playwright install --with-deps chromium && exit 0
            echo "install attempt $attempt failed; retrying in 20s"
            sleep 20
          done
          exit 1
      - run: npm run test:responsiveness
      - name: Add the report to the step summary
        if: always()
        run: |
          if [ -f test-results/responsiveness-report.md ]; then
            cat test-results/responsiveness-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: responsiveness-report
          path: |
            test-results/responsiveness-report.md
            test-results/responsiveness-report.json
          if-no-files-found: warn
          retention-days: 30

  text-mode-perf:
    name: Text mode timings (reporting; size and order-of-magnitude caps)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium and system dependencies
        run: |
          for attempt in 1 2 3; do
            sudo apt-get update -q && npx playwright install --with-deps chromium && exit 0
            echo "install attempt $attempt failed; retrying in 20s"
            sleep 20
          done
          exit 1
      # tests/e2e/text-mode-perf.spec.ts (phase-1.md 8.4): keystroke to paint, cold load and
      # JavaScript size on desktop Chrome. Moved off every push because it takes about 8 minutes.
      - run: npm run test:e2e:perf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: text-mode-perf
          path: test-results/text-mode-perf.json
          if-no-files-found: warn
          retention-days: 30

  gantt-perf:
    name: Gantt frame times (500 tasks; desktop and Pixel 7 emulation at 4x CPU)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium and system dependencies
        run: |
          for attempt in 1 2 3; do
            sudo apt-get update -q && npx playwright install --with-deps chromium && exit 0
            echo "install attempt $attempt failed; retrying in 20s"
            sleep 20
          done
          exit 1
      - run: npm run build
      # tests/e2e/gantt-perf.spec.ts (phase-2.md 8.4): scroll, pan, pinch, drag and a result during
      # a scroll on gantt-500. The desktop profile has regression caps; the throttled phone profile
      # is recorded and judged against the 18.7 definition in the JSON. One worker, so that the two
      # profiles do not share the runner's CPUs.
      - run: npx playwright test tests/e2e/gantt-perf.spec.ts --project=desktop --project=pixel-7 --workers=1
        env:
          E2E_PERF: '1'
      - name: Summarise
        if: always()
        run: |
          if [ -f test-results/gantt-perf.json ]; then
            { echo '## Gantt frame times'; echo; echo '```'; node scripts/gantt-perf-summary.mjs; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gantt-perf
          path: test-results/gantt-perf.json
          if-no-files-found: warn
          retention-days: 30
