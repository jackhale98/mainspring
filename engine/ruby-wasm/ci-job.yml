#
# CI job sketch for the OpenSSL-free ruby.wasm (phase-4 T13). NOT ACTIVE: it lives here, not in
# .github/workflows/, until T13's finish (wave 6) and T24 adopt it. Copy it into a workflow (a job
# of ci.yml, or its own workflow file) to run it. It needs github.com (wasi-sdk, wasi-vfs and
# zlib release assets), rubygems.org, cache.ruby-lang.org, pyyaml.org and archive.ubuntu.com.
#
# First run: inputs.json has no sha256 for wasi-sdk 22.0 and libwasi_vfs 0.6.2 (they could not be
# fetched where the recipe was written), so the build step passes --record-unpinned and logs
# "UNPINNED <key>: sha256 ...". Pin those in inputs.json and drop the flag.
#
# What it shows: the build (sizes in provenance.json), no OpenSSL in the binary, golden parity in
# Node and in Chromium on that binary, and what the VM loads. It does not switch the app: the
# site built by `npm run test:golden` here uses the new binary only inside this job.
name: ruby.wasm without OpenSSL

on:
  workflow_dispatch:

jobs:
  ruby-wasm:
    name: ruby.wasm without OpenSSL (build, check, parity)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The host Ruby runs rbwasm and is the baseruby's compiler driver only; it does not ship.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.6'
          bundler: '4.0.18'
      - name: Cache the recipe's downloads and the Ruby build
        uses: actions/cache@v4
        with:
          path: ~/.cache/mainspring-ruby-wasm
          key: ruby-wasm-${{ runner.os }}-${{ hashFiles('engine/ruby-wasm/inputs.json', 'engine/ruby-wasm/Gemfile.lock', 'engine/ruby-wasm/build.rb', 'engine/ruby-wasm/build.sh') }}
      - name: Build (wasi-sdk 22.0, wasi-vfs, full profile minus openssl)
        run: engine/ruby-wasm/build.sh --toolchain wasi-sdk --record-unpinned
      - name: No OpenSSL in the binary; what dropping it removed
        run: |
          mkdir -p test-results
          node engine/ruby-wasm/check-binary.mjs engine/ruby-wasm/out/ruby.debug+stdlib.wasm \
            engine/ruby-wasm/out/ruby+stdlib.wasm \
            --compare node_modules/@ruby/3.4-wasm-wasi/dist/ruby.debug+stdlib.wasm \
            --json test-results/ruby-wasm-binary.json
      - name: The stock binary still shows OpenSSL (checks the check)
        run: node engine/ruby-wasm/check-binary.mjs node_modules/@ruby/3.4-wasm-wasi/dist/ruby+stdlib.wasm --expect-openssl
      - name: Engine on the new binary
        run: >
          node engine/build-bundle.mjs --ruby-wasm engine/ruby-wasm/out/ruby+stdlib.wasm
          --ruby-wasm-version 2.10.1+no-openssl
      - name: Golden parity in Node, keyword docs and tokens
        run: node engine/golden/run-wasm.mjs --syntax --tokens --json test-results/golden-no-openssl.json
      - name: What the VM loads; require "openssl" must raise LoadError
        run: node engine/ruby-wasm/run-engine.mjs --json test-results/ruby-wasm-features.json
      - name: Install Chromium
        run: |
          for attempt in 1 2 3; do
            sudo apt-get update -q && npx playwright install --with-deps chromium && exit 0
            sleep 20
          done
          exit 1
      # npm run build runs build:engine, which picks the binary up from MAINSPRING_RUBY_WASM.
      - name: Golden parity in Chromium (npm run test:golden)
        run: npm run test:golden
        env:
          MAINSPRING_RUBY_WASM: engine/ruby-wasm/out/ruby+stdlib.wasm
          MAINSPRING_RUBY_WASM_VERSION: 2.10.1+no-openssl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ruby-wasm-no-openssl
          path: |
            engine/ruby-wasm/out/ruby+stdlib.wasm
            engine/ruby-wasm/out/provenance.json
            engine/ruby-wasm/out/exts.json
            public/engine/manifest.json
            test-results/ruby-wasm-*.json
            test-results/golden-no-openssl.json
            test-results/golden-report.*
          if-no-files-found: warn
          retention-days: 30
